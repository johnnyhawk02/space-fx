<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Drive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../host/style.css">
<link rel="stylesheet" href="host/style.css">
</head>
<body>
<header class="bar">
  <button id="open">Open</button>
  <input id="file" type="file" accept="audio/*,.wav,.aif,.aiff" hidden>
  <span id="filename" class="dim">Drop an audio file anywhere</span>
  <span class="gap"></span>
  <button id="play" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
  <button id="loop" class="toggle on">Loop</button>
  <label class="field">Tempo <input id="tempo" type="number" min="20" max="300" step="0.01" value="120"></label>
  <span class="gap"></span>
  <a class="other" href="../">Space FX</a>
</header>

<canvas id="wave" height="90"></canvas>

<section class="rack" id="rack">
  <div class="body"><div id="slots" class="slots"></div></div>
</section>

<footer id="info" class="info">Drag a dial up and down; Shift for fine; double-click resets. Draw the steps in the Sequencer's picture.</footer>

<script type="module" src="host/app.js"></script>
</body>
</html>
