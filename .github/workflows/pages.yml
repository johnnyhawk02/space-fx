# Publishes the rack to GitHub Pages (johnnyhawk02.github.io/space-fx) on every push to main.
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect the site
        run: |
          mkdir site
          cp -r index.html host dsp worklet audio site/
          # Stamp every script and stylesheet path with this commit, so a browser never mixes
          # a fresh page with stale cached files (that left the panel blank).
          V=${GITHUB_SHA::8}
          find site -name '*.js' -o -name 'index.html' | xargs sed -i -E "s#([A-Za-z0-9_./-]+\.(js|css))(['\"])#\1?v=$V\3#g"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
