<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space FX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="host/style.css">
</head>
<body>
<header class="bar">
  <button id="open">Open</button>
  <input id="file" type="file" accept="audio/*,.wav,.aif,.aiff" hidden>
  <span id="filename" class="dim">Drop an audio file anywhere</span>
  <span class="gap"></span>
  <button id="play" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
  <button id="loop" class="toggle on">Loop</button>
  <label class="field">Tempo <input id="tempo" type="number" min="20" max="300" step="0.01" value="120"></label>
  <span class="gap"></span>
  <select id="presets" title="Presets"></select>
  <input id="name" class="name" spellcheck="false" title="Preset name">
  <button id="save">Save</button>
  <button id="delete">Delete</button>
  <button id="rand" title="A random rack, with a new name">Rand</button>
  <span class="gap"></span>
  <button id="export" disabled>Export Audio</button>
  <a class="other" href="drive/">Space Drive</a>
</header>

<canvas id="wave" height="90"></canvas>

<section class="rack" id="rack">
  <div class="body">
    <div id="slots" class="slots"></div>
    <div class="slot routing-panel">
      <div class="slot-head"><span class="sname">Routing</span></div>
      <div class="flow viz"></div>
      <div class="params grouped">
        <div class="group"><div class="ghead">Mode</div><div id="routing"></div></div>
        <div class="group"><div class="ghead">Main</div><div id="main" class="grow"></div></div>
      </div>
    </div>
  </div>
</section>

<footer id="info" class="info">Drag a dial up and down; Shift for fine; double-click resets.</footer>

<dialog id="exportDialog">
  <form method="dialog">
    <div class="title">Export Audio</div>
    <label class="field">Sample Rate <select id="exRate"><option value="0">Same as file</option><option>44100</option><option>48000</option><option>96000</option></select></label>
    <label class="field">Bit Depth <select id="exBits"><option>16</option><option selected>24</option><option>32</option></select></label>
    <label class="field"><input id="exNorm" type="checkbox"> Normalize</label>
    <label class="field">Tail <select id="exTail"><option value="auto" selected>Until silent (max 20 s)</option><option value="0">None</option><option value="5">5 s</option><option value="10">10 s</option></select></label>
    <div class="row"><button value="cancel">Cancel</button><button id="exGo" value="ok">Export</button></div>
  </form>
</dialog>

<script type="module" src="host/app.js"></script>
</body>
</html>
